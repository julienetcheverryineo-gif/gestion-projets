name: Déploiement Firebase Hosting + règles

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: appli-service
          channelId: live

      # Les règles Firestore/Storage (firestore.rules, storage.rules) ne
      # sont pas déployées par l'action ci-dessus (Hosting uniquement) —
      # sans cette étape, une nouvelle collection (ex. "notes") resterait
      # bloquée par les règles même après avoir mis à jour le code.
      - name: Déployer les règles Firestore/Storage
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > /tmp/firebase-service-account.json
          npx firebase-tools deploy --only firestore:rules,storage:rules \
            --project appli-service \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
