name: Déploiement Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: appli-service
          channelId: live

      # Les règles Firestore (firestore.rules) ne sont PAS déployées ici :
      # le compte de service CI n'a pas les droits IAM nécessaires (étape
      # systématiquement en échec, retirée du workflow). Quand
      # firestore.rules change, Julien le déploie lui-même depuis sa
      # machine avec `firebase deploy --only firestore:rules`.
